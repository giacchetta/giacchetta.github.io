# User-message template for the LinkedIn post generator.
# Consumed by actions/ai-inference@v3 via `prompt-file:` + `input:` + `file_input:`.
# - `input:` provides YAML-safe scalars ({{repo}}, {{pr_number}}, {{merge_date}}).
# - `file_input:` injects feed.json as {{feed}} (raw JSON) and
#   linkedin-post.system.md as {{system_prompt}} (raw text).
#   The PR title/body and JSON arrays are NOT inlined in `input:` because they
#   contain colons, `#`, and other chars that break YAML parsing.
#
# Voice, structure, frontmatter shape, and all hard rules live in
# linkedin-post.system.md, interpolated below as {{system_prompt}} — this
# file only wires it (and the feed) in. Don't restate a rule here; edit
# system.md instead.
#
# system_prompt is a file_input, NOT the `system-prompt-file:` action input:
# actions/ai-inference@v3 silently ignores system-prompt/system-prompt-file
# whenever prompt-file is a `.prompt.yml` — see post-on-merge.yml's "Run AI
# inference" step for the full explanation. Interpolating it into this file's
# own `role: system` message is what actually gets it to the model.

messages:
  - role: system
    content: |
      {{system_prompt}}

  - role: user
    content: |
      Write ONE LinkedIn post from the following merged PR feed. The post must
      be a complete Markdown file starting with frontmatter and ending at the
      end of the body. No prose before or after the file.

      ## Feed (JSON)

      The full PR feed is below. Read the fields to understand the engineering
      story, then synthesize the post per the system prompt.

      ```json
      {{feed}}
      ```

      Feed field reference:
      - `pr_title` — the PR title.
      - `pr_body` — the PR's raw body. Under the multi-issue PR scope
        protocol this is a `## Scope` checklist naming every issue in this
        diff, plus a `## References` section — read it for scope, not prose.
      - `comments` — array of `{author, created_at, body}`: the PR author's
        own comments, chronological. Under the protocol, one comment per
        issue (`## ✅ #<n> — <title>`: what landed, decisions worth flagging,
        verification evidence). **This is the primary source for the post** —
        mine it harder than the body.
      - `merge_date` — use as the frontmatter `date`.

      - **Repo:** {{repo}}
      - **PR number:** {{pr_number}}
      - **Merge date:** {{merge_date}} (use this as the frontmatter `date`)

      ## Instructions

      1. Read `pr_body` for scope — which issue(s) this PR covers.
      2. Read every entry in `comments` for the engineering story: what was
         built, what was ripped out, what was parked, what limitation was
         documented, what the verification evidence showed.
      3. Synthesize into the narrative sections and voice specified in the
         system prompt. Do NOT dump the comments verbatim or list them
         issue-by-issue — synthesize across them into one story.
      4. Output ONLY the Markdown file. No commentary.

model: auto
