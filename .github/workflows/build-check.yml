name: Build Check

# Build-only verification for PRs — catches a broken `npm run build` (e.g.
# from a Dependabot bump) before merge. This replaced the implicit coverage
# GitHub Pages' deploy workflow (static.yaml) used to give: that workflow
# built AND deployed; Cloudflare Pages now owns deployment (git-connected,
# production only — preview deployments are deliberately off, see
# tofu-gc-stack's cloudflare.tf), so this workflow exists purely to report a
# pass/fail build status on the PR. Required as a status check on `main`
# (branch protection) so a red build can't be merged, Dependabot included.

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
