name: Post on Merge

# Reusable workflow: generate a LinkedIn-style post from a merged PR in some
# other "lab" repo and open a pull request against THIS repo adding it under
# src/content/blog/<slug>.md (an Astro content collection). This repo's
# CODEOWNER reviews and merges that PR; static.yaml rebuilds and deploys on
# push to main.
#
# This workflow owns no trigger of its own beyond `workflow_call` (and a
# workflow_dispatch twin for self-testing from this repo) — the calling repo
# decides when to invoke it (typically `pull_request: closed` + a
# `merged == true` guard) and passes pr_number/source_repo. See
# .github/post-on-merge.md for the caller contract, inputs/secrets, and a
# copy-pasteable caller stub.
#
# One merged PR == one post. The PR's closing issues (parent + sub-issues)
# are gathered as narrative feed alongside the PR title/body/commits/diffstat.
#
# The scripts and prompts this workflow depends on live in THIS repo
# (.github/scripts, .github/prompts) rather than the caller's checkout — a
# reusable workflow runs against the caller's working tree, not its own, so
# step "Check out post-on-merge kit" below fetches this repo's own
# .github/scripts + .github/prompts at the exact commit this workflow file is
# running from (github.job_workflow_sha), so the YAML and the scripts it
# invokes can never drift apart.
#
# See .github/scripts/sanitize-post.py's header for the incident this guards
# against (PR #13 on openclaw-a2a-bridge: an un-escaped `<server>__<tool>`
# token silently emptied the built page's extracted content).

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number (in source_repo) to generate a post from"
        required: true
        type: string
      source_repo:
        description: "owner/name of the repo the PR lives in; defaults to the calling repo"
        required: false
        type: string
        default: ""
      target_repo:
        description: "owner/name of the repo posts are pushed to"
        required: false
        type: string
        default: "giacchetta/giacchetta.github.io"
      post_dir:
        description: "Target directory in target_repo for generated posts"
        required: false
        type: string
        default: "src/content/blog"
      model:
        description: "Model passed to actions/ai-inference"
        required: false
        type: string
        default: "auto"
      pipeline_ref:
        description: "Override ref to check out this repo's scripts/prompts from; defaults to the commit this workflow file is running from"
        required: false
        type: string
        default: ""
    secrets:
      copilot_token:
        description: "COPILOT_GITHUB_TOKEN for actions/ai-inference (a user PAT with a Copilot seat)"
        required: true
      posts_pat:
        description: "PAT with contents:write + pull-requests:write on target_repo"
        required: true

  # Manual self-test of this workflow from this repo directly.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (in source_repo) to generate a post from"
        required: true
        type: string
      source_repo:
        description: "owner/name of the repo the PR lives in"
        required: true
        type: string
      target_repo:
        description: "owner/name of the repo posts are pushed to"
        required: false
        type: string
        default: "giacchetta/giacchetta.github.io"
      post_dir:
        description: "Target directory in target_repo for generated posts"
        required: false
        type: string
        default: "src/content/blog"
      model:
        description: "Model passed to actions/ai-inference"
        required: false
        type: string
        default: "auto"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: post-on-merge-${{ inputs.source_repo || github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # gh (in gather-feed.sh) resolves the source repo from this rather than
      # a checked-out git remote, since this job never checks the source repo
      # out — only reads it via the API.
      GH_REPO: ${{ inputs.source_repo || github.repository }}
    steps:
      # Resolve the ref to fetch this repo's own scripts/prompts from.
      # github.job_workflow_sha is the commit of THIS reusable workflow file
      # (not the caller's github.sha, which points at the caller repo).
      - name: Resolve pipeline ref
        id: kit_ref
        env:
          OVERRIDE_REF: ${{ inputs.pipeline_ref }}
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          REF="${OVERRIDE_REF:-${WORKFLOW_SHA:-main}}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "::notice::Checking out post-on-merge kit at ${REF}"

      - name: Check out post-on-merge kit
        uses: actions/checkout@v6
        with:
          repository: giacchetta/giacchetta.github.io
          ref: ${{ steps.kit_ref.outputs.ref }}
          path: .postkit

      # Fail fast, before spending any AI-inference tokens, if the sanitizer
      # that guards the post body against bare `<word>` HTML-like tokens is
      # itself broken.
      - name: Self-test post sanitizer
        run: python3 .postkit/.github/scripts/sanitize-post.py --self-test

      - name: Install gh CLI is preinstalled on ubuntu-latest
        run: gh --version

      - name: Gather PR + linked issues feed
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          bash .postkit/.github/scripts/gather-feed.sh > feed.json
          # Show a compact summary in the workflow log for debugging.
          jq '{pr_number, pr_title, repo, merge_date, issue_count: (.issues|length), commit_count: (.commits|length), files_changed: (.files_changed|length)}' feed.json
          # Expose the feed as a step output for the inference step. Use the
          # heredoc form so multi-line JSON survives intact into the output.
          {
            echo "feed<<EOF"
            cat feed.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run AI inference
        id: ai
        uses: actions/ai-inference@v3
        with:
          prompt-file: .postkit/.github/prompts/linkedin-post.prompt.yml
          system-prompt-file: .postkit/.github/prompts/linkedin-post.system.md
          model: ${{ inputs.model }}
          # Only YAML-safe scalars go in `input:`. The PR title/body and JSON
          # arrays contain colons, `#`, and other chars that break YAML parsing
          # (a v3 failure on a past merge: "bad indentation of a mapping entry"
          # at `pr_title: ci(post): ...`). The full feed is injected as a
          # single {{feed}} file variable via `file_input:` instead.
          input: |
            repo: "${{ inputs.source_repo || github.repository }}"
            pr_number: ${{ fromJSON(steps.gather.outputs.feed).pr_number }}
            merge_date: "${{ fromJSON(steps.gather.outputs.feed).merge_date }}"
          file_input: |
            feed: feed.json
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot_token }}

      # Clean the AI response (strip CRLF + leading/trailing code fences) and
      # derive the post's path/filename from a single grepped `slug:` line in
      # the model's frontmatter, falling back to a slugified PR_TITLE (from
      # gather) when that line is missing or invalid — NOT by parsing the
      # model's frontmatter as YAML. See prepare-post.sh's header for why.
      - name: Prepare generated post
        id: post
        env:
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
          PR_TITLE: ${{ fromJSON(steps.gather.outputs.feed).pr_title }}
          PR_NUMBER: ${{ inputs.pr_number }}
          POST_DIR: ${{ inputs.post_dir }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
        run: |
          set -euo pipefail
          bash .postkit/.github/scripts/prepare-post.sh

      # Push the post to the target repo via a short-lived branch + pull
      # request (NOT a direct push to main). The target repo's CODEOWNER
      # reviews and merges the PR; its static.yaml workflow rebuilds and
      # deploys on push to main. Requires the posts_pat secret (PAT with
      # contents:write + pull-requests:write on target_repo).
      - name: Push post to target repo
        env:
          POSTS_PAT: ${{ secrets.posts_pat }}
          POST_PATH: ${{ steps.post.outputs.path }}
          POST_FILENAME: ${{ steps.post.outputs.filename }}
          POST_TITLE: ${{ steps.post.outputs.title }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CLEANED_FILE: ${{ steps.post.outputs.cleaned_file }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          bash .postkit/.github/scripts/push-post.sh

      - name: Print generated post to log
        if: always()
        env:
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        run: |
          echo "::group::Generated post (raw model response)"
          if [ -n "$RESPONSE_FILE" ] && [ -f "$RESPONSE_FILE" ]; then
            cat "$RESPONSE_FILE"
          else
            echo "(no response file — ai-inference step did not produce output)"
          fi
          echo "::endgroup::"
